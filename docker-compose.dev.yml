version: "3.8"
services:
  db:
    # ！！！重要：必须与 docker-compose.yaml 中的配置完全一致 ！！！
    image: postgres:15
    environment:
      POSTGRES_USER: gradeitDB
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: gradeit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 可以增加健康检查，确保应用启动时数据库已就绪
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradeitDB"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # 确保使用开发环境变量，如指向本地db
      DATABASE_URL: postgresql://gradeitDB:mypassword@db:5432/gradeit?sslmode=disable
      NODE_ENV: development # 设为开发模式
    volumes:
      # 核心挂载：将当前目录映射到容器的 /app，排除 node_modules
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    # 覆盖原启动命令，通常开发模式用 dev 脚本
    command: npm run dev
    # 或者如果原Dockerfile已优化，也可用: command: npm start

volumes:
  postgres_data:
