# Judge0 local config for docker-compose
# NOTE: keep REDIS_PASSWORD consistent with docker-compose redis command.

# Core dependencies
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_db_password

REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0_redis_password

# Runtime behavior
RAILS_ENV=production
ENABLE_WAIT_RESULT=true
ENABLE_CALLBACKS=true

# Optional tuning
COUNT=2
INTERVAL=0.1
MAX_QUEUE_SIZE=100
