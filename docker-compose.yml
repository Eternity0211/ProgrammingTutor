version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: gradeitDB
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: gradeit
    ports:
      - "5173:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - gradeit_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://gradeitDB:mypassword@db:5432/gradeit
      - LOCAL_LLM_BASE_URL=http://local-llm:8000/v1
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-qwen2.5-7b-instruct-lora}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-local-dev-key}
      - JUDGE0_API_URL=http://judge0-server:2358
      - JUDGE0_API_KEY=
      - JUDGE0_API_HOST=
      - JUDGE0_CPP_LANGUAGE_ID=54
    depends_on:
      - db
      - judge0-server
      - local-llm
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  local-llm:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/vllm/vllm-openai:v0.6.4
    ports:
      - "8000:8000"
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ../models/qwen2.5-7b-instruct:/models/qwen2.5-7b-instruct:ro
      - ../final:/adapters/final
    command: >
      --model /models/qwen2.5-7b-instruct
      --served-model-name qwen2.5-7b-instruct-lora
      --enable-lora
      --lora-modules tutor-lora=/adapters/final
      --trust-remote-code
      --port 8000
      --max-model-len 8192
    restart: unless-stopped

  judge0-server:
    image: judge0/judge0:latest
    privileged: true
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped

  judge0-worker:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    privileged: true
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped

  judge0-db:
    image: postgres:16.2
    env_file:
      - ./judge0.conf
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "judge0_redis_password",
      ]
    volumes:
      - judge0_redis_data:/data
    restart: unless-stopped
volumes:
  gradeit_node_modules:
  db_data:
  judge0_postgres_data:
  judge0_redis_data:
