version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: gradeitDB
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: gradeit
    ports:
      - "5173:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  gradeit-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - gradeit_node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://gradeitDB:mypassword@db:5432/gradeit
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AI_GROQ_API_KEY=${AI_GROQ_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - JUDGE0_API_URL=http://judge0-server:2358
      - JUDGE0_API_KEY=
      - JUDGE0_API_HOST=
      - JUDGE0_CPP_LANGUAGE_ID=54
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-change-me-in-env}
    depends_on:
      - db
      - judge0-server
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  judge0-server:
    image: judge0/judge0:latest
    privileged: true
    environment:
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - judge0_box:/box
    ports:
      - "2358:2358"
    depends_on:
      judge0-box-init:
        condition: service_completed_successfully
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started
    restart: unless-stopped

  judge0-worker:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    privileged: true
    environment:
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "true"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "true"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - judge0_box:/box
    depends_on:
      judge0-box-init:
        condition: service_completed_successfully
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started
    restart: unless-stopped

  judge0-box-init:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - judge0_box:/box
    command: ["sh", "-c", "chown 1000:999 /box && chmod 0775 /box"]

  judge0-db:
    image: postgres:16.2
    env_file:
      - ./judge0.conf
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "judge0_redis_password",
      ]
    volumes:
      - judge0_redis_data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-in-env}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
volumes:
  gradeit_node_modules:
  db_data:
  judge0_box:
  neo4j_data:
  neo4j_logs:
  judge0_postgres_data:
  judge0_redis_data:
