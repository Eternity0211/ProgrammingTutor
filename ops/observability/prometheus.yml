global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/programming-tutor.yml

scrape_configs:
  - job_name: programming-tutor
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials: local-observability-token
    static_configs:
      - targets: ["gradeit-dev:3000"]
