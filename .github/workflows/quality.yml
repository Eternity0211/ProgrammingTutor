name: Quality

on:
  push:
    branches: [feature-agent-tutor, main]
  pull_request:
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch:
    inputs:
      run_external:
        description: Run real PostgreSQL, Neo4j and Judge0 integration tests
        required: false
        default: false
        type: boolean

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:dataset:strict
      - run: npm run lint:multi-agent
      - run: npm run typecheck
      - run: npm run test:observability
      - run: npm run test:resilience
      - run: npm run test:ai-quality
      - run: npm run test:multi-agent
      - run: npm run test:ci
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-secret-at-least-32-characters
          JUDGE0_API_KEY: ci-placeholder
          JUDGE0_API_HOST: judge0.invalid
          DEEPSEEK_API_KEY: ci-placeholder
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-placeholder
          METRICS_TOKEN: ci-placeholder
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://localhost:4318/v1/traces

  external-integration:
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_external)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: programming-tutor-ci
      POSTGRES_USER: gradeit_ci
      POSTGRES_PASSWORD: gradeit_ci_password
      POSTGRES_DB: gradeit_ci
      POSTGRES_HOST_PORT: 5173
      DATABASE_URL: postgresql://gradeit_ci:gradeit_ci_password@localhost:5173/gradeit_ci
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-neo4j-password
      JUDGE0_API_URL: http://localhost:2358
      JUDGE0_CPP_LANGUAGE_ID: 54
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start real service containers
        run: docker compose up -d db neo4j judge0-server judge0-worker
      - name: Wait for real services
        run: npm run services:wait
      - name: Apply the real PostgreSQL schema
        run: npx prisma migrate deploy
      - run: npm run test:integration:external
      - name: Print service diagnostics
        if: always()
        run: docker compose ps -a && docker compose logs --no-color --tail=200 db neo4j judge0-server judge0-worker
      - name: Stop real service containers
        if: always()
        run: docker compose down -v --remove-orphans
