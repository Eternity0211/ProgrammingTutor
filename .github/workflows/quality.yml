name: Quality

on:
  push:
    branches: [feature-agent-tutor, main]
  pull_request:
  schedule:
    - cron: "0 18 * * 1"
  workflow_dispatch:
    inputs:
      run_external:
        description: Run real PostgreSQL, Neo4j and Judge0 integration tests
        required: false
        default: false
        type: boolean

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Validate observability Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet
      - name: Validate Prometheus alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/ops:/etc/programming-tutor:ro" prom/prometheus:v3.15.0 check rules /etc/programming-tutor/prometheus-alerts.yml
      - name: Validate OpenTelemetry Collector configuration
        run: docker run --rm -v "$PWD/ops/observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro" otel/opentelemetry-collector-contrib:0.161.0 validate --config=/etc/otelcol-contrib/config.yml
      - name: Regenerate versioned neural dataset
        run: npm run build:dataset
      - name: Verify generated dataset is committed
        run: git diff --exit-code -- data/neural
      - run: npm run validate:dataset:strict
      - run: npm run validate:exercises
      - run: npm run lint:multi-agent
      - run: npm run typecheck
      - run: npm run test:observability
      - run: npm run test:resilience
      - run: npm run test:ai-quality
      - run: npm run test:multi-agent
      - run: npm run test:ci
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-secret-at-least-32-characters
          JUDGE0_API_KEY: ci-placeholder
          JUDGE0_API_HOST: judge0.invalid
          DEEPSEEK_API_KEY: ci-placeholder
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci-placeholder
          METRICS_TOKEN: ci-placeholder
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://localhost:4318/v1/traces
          EVALUATION_EXECUTION_MODE: queue
      - name: Install browser for end-to-end smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end smoke tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-secret-at-least-32-characters

  external-integration:
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_external)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: programming-tutor-ci
      POSTGRES_USER: gradeit_ci
      POSTGRES_PASSWORD: gradeit_ci_password
      POSTGRES_DB: gradeit_ci
      POSTGRES_HOST_PORT: 5173
      DATABASE_URL: postgresql://gradeit_ci:gradeit_ci_password@localhost:5173/gradeit_ci
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-neo4j-password
      JUDGE0_API_URL: http://localhost:2358
      JUDGE0_CPP_LANGUAGE_ID: 54
      EXTERNAL_SERVICES_TIMEOUT_MS: 480000
      EXTERNAL_SERVICES_RETRY_MS: 5000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start real service containers
        run: docker compose up -d db neo4j judge0-server judge0-worker
      - name: Show initial service state
        run: docker compose ps -a
      - name: Wait for real services
        run: npm run services:wait
      - name: Apply the real PostgreSQL schema
        run: npx prisma migrate deploy
      - run: npm run test:integration:external
      - name: Seed authenticated acceptance data
        run: npm run db:seed
        env:
          DEMO_PASSWORD: ci-demo-password
      - name: Build application for authenticated acceptance tests
        run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-at-least-32-characters
          DEEPSEEK_API_KEY: ci-placeholder
          JUDGE0_API_KEY: ci-placeholder
          JUDGE0_API_HOST: localhost
          METRICS_TOKEN: ci-placeholder
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://localhost:4318/v1/traces
          EVALUATION_EXECUTION_MODE: queue
      - name: Install browser for authenticated acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Run seeded faculty and student journeys
        run: npm run test:e2e:authenticated
        env:
          AUTH_SECRET: ci-only-secret-at-least-32-characters
          DEMO_PASSWORD: ci-demo-password
      - name: Upload authenticated acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-acceptance-diagnostics-${{ github.run_attempt }}
          path: |
            .data/e2e-status.json
            .data/playwright-results
          if-no-files-found: warn
          retention-days: 7
      - name: Print service diagnostics
        if: always()
        run: docker compose ps -a && docker compose logs --no-color --tail=200 db neo4j judge0-server judge0-worker
      - name: Stop real service containers
        if: always()
        run: docker compose down -v --remove-orphans
