name: Quality

on:
  push:
    branches: [feature-agent-tutor, main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:dataset:strict
      - run: npm run typecheck
      - run: npm test -- --runInBand
